# Optional. Requires an ingress controller (for example ingress-nginx or the AWS Load Balancer Controller).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-calculator
  labels:
    app: devops-calculator
spec:
  ingressClassName: nginx
  rules:
    - host: calculator.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-calculator
                port:
                  name: http
