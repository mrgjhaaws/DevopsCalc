name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devops-calculator

jobs:
  # Steps 3-6: checkout, JDK + Maven, build and test, SonarQube scan
  build-test:
    name: Build, test and scan
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history gives SonarQube accurate blame data

      - name: Set up JDK 17 and Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test with Maven
        run: mvn -B clean install

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar
          -Dsonar.host.url=$SONAR_HOST_URL
          -Dsonar.token=$SONAR_TOKEN

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops-calculator-jar
          path: target/devops-calculator.jar
          if-no-files-found: error

  # Step 7: build the Docker image and push it to Amazon ECR (main branch only)
  docker:
    name: Docker build and push to ECR
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets GitHub assume an AWS role via OIDC, so no long-lived keys
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: meta
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "image=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"

  # Steps 8-10: update manifests, deploy to Kubernetes, verify the rollout
  deploy:
    name: Deploy to Kubernetes
    needs: docker
    if: vars.EKS_CLUSTER_NAME != ''
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Connect to the EKS cluster
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "$AWS_REGION"

      - name: Update Kubernetes manifest with the new image
        run: |
          sed -i "s|image: .*devops-calculator.*|image: ${{ needs.docker.outputs.image }}|" k8s/deployment.yaml
          grep "image:" k8s/deployment.yaml

      - name: Deploy with kubectl apply
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Verify rollout (Prometheus and Grafana take over from here)
        run: |
          kubectl rollout status deployment/devops-calculator --timeout=120s
          kubectl get pods -l app=devops-calculator
