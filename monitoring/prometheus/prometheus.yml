global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # docker compose: the app container is reachable as "calculator"
  - job_name: calculator
    metrics_path: /metrics
    static_configs:
      - targets: ["calculator:8080"]

