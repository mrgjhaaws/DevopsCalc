<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevOps Calculator</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --text:#e2e8f0; --muted:#94a3b8; --err:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; }
  main { width:100%; max-width:420px; background:var(--card); border-radius:16px; padding:24px;
         box-shadow:0 10px 30px rgba(0,0,0,.4); }
  h1 { margin:0 0 4px; font-size:1.4rem; }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:.9rem; }
  label { display:block; font-size:.8rem; color:var(--muted); margin:12px 0 4px; }
  input, select, button { width:100%; padding:12px; font-size:1rem; border-radius:10px; border:1px solid #334155;
                          background:#0b1220; color:var(--text); }
  button { background:var(--accent); color:#0b1220; font-weight:600; border:0; margin-top:18px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  #result { margin-top:18px; padding:14px; border-radius:10px; background:#0b1220; min-height:52px;
            font-size:1.1rem; word-break:break-all; }
  #result.error { color:var(--err); }
  ul { list-style:none; padding:0; margin:16px 0 0; color:var(--muted); font-size:.85rem; }
  li { padding:4px 0; border-top:1px solid #334155; }
  footer { margin-top:16px; font-size:.75rem; color:var(--muted); text-align:center; }
  a { color:var(--accent); }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>DevOps Calculator</h1>
  <p class="sub">Add, subtract, multiply, divide, percentage and square root.</p>

  <label for="op">Operation</label>
  <select id="op">
    <option value="add">Addition (+)</option>
    <option value="subtract">Subtraction (-)</option>
    <option value="multiply">Multiplication (x)</option>
    <option value="divide">Division (/)</option>
    <option value="percentage">Percentage (%)</option>
    <option value="sqrt">Square root</option>
    <option value="power">Power (a^b)</option>
  </select>

  <div id="modeBox" class="hidden">
    <label for="mode">Percentage mode</label>
    <select id="mode">
      <option value="of">A% of B</option>
      <option value="change">% change from A to B</option>
      <option value="what">A is what % of B</option>
    </select>
  </div>

  <label for="a" id="labelA">First number</label>
  <input id="a" type="text" inputmode="decimal" placeholder="e.g. 25" autocomplete="off">

  <div id="bBox">
    <label for="b" id="labelB">Second number</label>
    <input id="b" type="text" inputmode="decimal" placeholder="e.g. 80" autocomplete="off">
  </div>

  <button id="go" type="button">Calculate</button>
  <div id="result" aria-live="polite">Result appears here</div>
  <ul id="historyList"></ul>
  <footer>API: <a href="/health">/health</a> &middot; <a href="/metrics">/metrics</a></footer>
</main>

<script>
  var op = document.getElementById('op');
  var mode = document.getElementById('mode');
  var a = document.getElementById('a');
  var b = document.getElementById('b');
  var result = document.getElementById('result');
  var historyList = document.getElementById('historyList');

  function refresh() {
    var o = op.value;
    document.getElementById('bBox').classList.toggle('hidden', o === 'sqrt');
    document.getElementById('modeBox').classList.toggle('hidden', o !== 'percentage');
    document.getElementById('labelA').textContent = o === 'sqrt' ? 'Number' : 'First number';
  }
  op.addEventListener('change', refresh);
  refresh();

  function calculate() {
    var params = new URLSearchParams();
    params.set('a', a.value);
    if (op.value !== 'sqrt') { params.set('b', b.value); }
    if (op.value === 'percentage') { params.set('mode', mode.value); }
    fetch('/api/' + op.value + '?' + params.toString())
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
      .then(function (res) {
        result.classList.toggle('error', !res.ok);
        if (res.ok) {
          result.textContent = res.body.expression;
          var li = document.createElement('li');
          li.textContent = res.body.expression;
          historyList.insertBefore(li, historyList.firstChild);
          while (historyList.children.length > 5) { historyList.removeChild(historyList.lastChild); }
        } else {
          result.textContent = res.body.error;
        }
      })
      .catch(function () {
        result.classList.add('error');
        result.textContent = 'Could not reach the server.';
      });
  }
  document.getElementById('go').addEventListener('click', calculate);
  [a, b].forEach(function (el) {
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter') { calculate(); } });
  });
</script>
</body>
</html>
